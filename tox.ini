[tox]
envlist = py311, flake8
setupdir=python

[testenv:flake8]
basepython=python3
deps=flake8
commands=flake8 --ignore=F401 python/pyspark_cassandra

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/pyspark_cassandra
commands = /bin/echo "$ make tests"
allowlist_externals=/bin/echo

deps =
     -r{toxinidir}/python/requirements.txt
     -r{toxinidir}/python/requirements_dev.txt